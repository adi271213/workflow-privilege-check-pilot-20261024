'on': workflow_dispatch
permissions: {}
jobs:
  test:
    runs-on:
    - self-hosted
    - ${{ matrix.pool }}
    - ${{ matrix.arch }}
    steps:
    - run: echo unused
    strategy:
      matrix:
        include:
        - pool: test
          arch: arm64
          python: '3.14'
        - pool: prod
          arch: x64
          python: '3.14'
