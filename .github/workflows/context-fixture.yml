name: Unused initial-version context fixture
'on':
  workflow_dispatch:
    inputs:
      target:
        type: string
        default: staging
permissions: {}
jobs:
  context:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
    - run: echo fixture
  guarded:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.invalid/old
    steps:
    - run: echo fixture
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        python:
        - '3.11'
    steps:
    - run: echo fixture
